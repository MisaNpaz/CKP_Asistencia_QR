<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de superAdmin — Control de asistencia con QR</title>
<style>
  :root {
    --bg: #f4f5f2; --card: #ffffff; --border: #dedcd2; --text: #24231f;
    --text-secondary: #6d6b62; --accent: #185fa5; --accent-bg: #e6f1fb;
    --danger: #a32d2d; --danger-bg: #fcebeb; --success: #0f6e56; --success-bg: #e1f5ee;
    --warn: #a0631f; --warn-bg: #fdf0dd; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 18px; font-weight: 600; margin: 0; }
  .container { max-width: 900px; margin: 0 auto; padding: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 16px;
  }
  label { display: block; font-size: 13px; color: var(--text-secondary); margin: 10px 0 4px; }
  input {
    width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; background: #fff; color: var(--text);
  }
  input:focus { outline: none; border-color: var(--accent); }
  button.primary {
    margin-top: 14px; background: var(--accent); color: #fff; border: none;
    padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  button.secondary {
    background: #fff; border: 1px solid var(--border); padding: 7px 12px; border-radius: 8px;
    font-size: 13px; cursor: pointer; color: var(--text);
  }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  #login-screen .card { max-width: 360px; width: 100%; }
  #app-screen { display: none; }
  .badge { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; }
  .badge.active { background: var(--success-bg); color: var(--success); }
  .badge.suspended { background: var(--warn-bg); color: var(--warn); }
  .org-row {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    padding: 14px 0; border-bottom: 1px solid var(--border);
  }
  .org-row:last-child { border-bottom: none; }
  .org-name { font-weight: 600; font-size: 14px; }
  .org-meta { font-size: 12px; color: var(--text-secondary); }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  #msg-login { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }
  .empty { color: var(--text-secondary); font-size: 13px; text-align: center; padding: 20px 0; }
  .confirm-box { background: var(--danger-bg); border-radius: 8px; padding: 12px; margin-top: 8px; font-size: 13px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="card">
    <h1>Panel de superAdmin</h1>
    <p style="font-size:13px; color:var(--text-secondary); margin:4px 0 0;">Gestión de todas las organizaciones.</p>
    <label>Correo</label>
    <input type="text" id="login-email">
    <label>Contraseña</label>
    <input type="password" id="login-password">
    <button class="primary" id="btn-login" style="width:100%;">Iniciar sesión</button>
    <div id="msg-login"></div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <header>
    <h1>Panel de superAdmin</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <span id="user-label" style="font-size:12px; color:var(--text-secondary);"></span>
      <button class="secondary" id="btn-logout">Salir</button>
    </div>
  </header>
  <div class="container">
    <div class="card">
      <h2 style="margin:0 0 4px; font-size:15px;">Organizaciones</h2>
      <p style="font-size:12px; color:var(--text-secondary); margin:0 0 10px;">Suspender bloquea el acceso a todos los usuarios de esa organización de inmediato. Eliminar borra todo de forma permanente.</p>
      <div id="org-list"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBtknYhSzzMYJ21vffJmIyV-rchTxdDaak",
  authDomain: "ckp-asistencia-qr.firebaseapp.com",
  projectId: "ckp-asistencia-qr",
  storageBucket: "ckp-asistencia-qr.firebasestorage.app",
  messagingSenderId: "570471221314",
  appId: "1:570471221314:web:0c2e58deedaf8b531345db"
};

const DELETE_ORG_URL = 'https://deleteorganization-ck2xk54qia-uc.a.run.app';

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
let currentUser = null;

document.getElementById('btn-login').addEventListener('click', async () => {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const msg = document.getElementById('msg-login');
  msg.style.display = 'none';
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    msg.textContent = 'Correo o contraseña incorrectos.';
    msg.style.display = 'block';
  }
});

document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-screen').style.display = 'none';
    return;
  }
  const roleSnap = await getDoc(doc(db, 'userRoles', user.uid));
  const isSuperAdmin = roleSnap.exists() && roleSnap.data().superAdmin === true;
  if (!isSuperAdmin) {
    document.getElementById('msg-login').textContent = 'Esta cuenta no tiene permisos de superAdmin.';
    document.getElementById('msg-login').style.display = 'block';
    await signOut(auth);
    return;
  }
  currentUser = user;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('user-label').textContent = user.email;
  loadOrgs();
});

async function loadOrgs() {
  const list = document.getElementById('org-list');
  list.innerHTML = '<div class="empty">Cargando...</div>';
  const snap = await getDocs(collection(db, 'organizations'));
  if (snap.empty) {
    list.innerHTML = '<div class="empty">No hay organizaciones registradas.</div>';
    return;
  }
  const orgs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name));
  list.innerHTML = '';
  orgs.forEach(org => renderOrgRow(org));
}

function renderOrgRow(org) {
  const list = document.getElementById('org-list');
  const row = document.createElement('div');
  row.className = 'org-row';
  row.id = 'org-row-' + org.id;
  const isActive = org.status !== 'suspended';
  row.innerHTML = `
    <div>
      <div class="org-name">${org.name} <span class="badge ${isActive ? 'active' : 'suspended'}">${isActive ? 'Activo' : 'Suspendido'}</span></div>
      <div class="org-meta">ID: ${org.id}</div>
    </div>
    <div class="row-actions">
      <button class="secondary" onclick="toggleSuspend('${org.id}', ${isActive})">${isActive ? 'Suspender' : 'Reactivar'}</button>
      <button class="secondary danger" onclick="askDelete('${org.id}')">Eliminar</button>
    </div>
  `;
  list.appendChild(row);
}

window.toggleSuspend = async (orgId, isActive) => {
  await updateDoc(doc(db, 'organizations', orgId), { status: isActive ? 'suspended' : 'active' });
  loadOrgs();
};

window.askDelete = (orgId) => {
  const row = document.getElementById('org-row-' + orgId);
  row.innerHTML = `
    <div class="confirm-box" style="width:100%;">
      <strong>Esto elimina permanentemente "${orgId}": alumnos, cursos, registros y cuentas de acceso.</strong>
      <p style="margin:6px 0 4px;">Escribe <code>${orgId}</code> para confirmar:</p>
      <input type="text" id="confirm-input-${orgId}" placeholder="${orgId}">
      <div class="row-actions" style="margin-top:8px;">
        <button class="secondary danger" onclick="confirmDelete('${orgId}')">Eliminar permanentemente</button>
        <button class="secondary" onclick="loadOrgs()">Cancelar</button>
      </div>
    </div>
  `;
};

window.confirmDelete = async (orgId) => {
  const input = document.getElementById('confirm-input-' + orgId);
  if (input.value.trim() !== orgId) {
    alert('El texto no coincide con el ID de la organización.');
    return;
  }
  const idToken = await currentUser.getIdToken();
  try {
    const response = await fetch(DELETE_ORG_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
      body: JSON.stringify({ orgId })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Error al eliminar.');
    loadOrgs();
  } catch (err) {
    alert('No se pudo eliminar: ' + err.message);
  }
};
</script>
</body>
</html>
